site_name: felt
site_url: https://cailmdaley.github.io/felt/
repo_url: https://github.com/cailmdaley/felt

theme:
  name: material
  # Stock Material pulls Roboto from fonts.googleapis.com. docs/stylesheets/felt.css
  # names its own stacks (EB Garamond / IBM Plex Mono, falling back to Georgia and a
  # system mono), so the fetch would buy nothing and the site ships with no external
  # requests at all.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy

extra_css:
  - stylesheets/felt.css

validation:
  links:
    absolute_links: info
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Shuttle orchestration:
      - Overview: shuttle/index.md
      - Installation: shuttle/installation.md
      - Constitutions: shuttle/constitutions.md
      - Lifecycle: shuttle/lifecycle.md
      - The board: shuttle/board.md
      - Cycles and eras: shuttle/cycles.md
      - Telemetry and the ledgers: shuttle/telemetry.md
  - Concepts:
      - Fibers: concepts/fibers.md
      - Organizing: concepts/organizing.md
      - Frontmatter: concepts/frontmatter.md
      - Companions: concepts/companions.md
      - Cross-Project: concepts/cross-project.md
  - Agents & Plugin: agents.md
  - Reference:
      - CLI: reference/cli.md
      - Daemon HTTP API: reference/api.md
  - Contributing: https://github.com/cailmdaley/felt/blob/main/CONTRIBUTING.md
  - Architecture (AGENTS.md): https://github.com/cailmdaley/felt/blob/main/AGENTS.md
