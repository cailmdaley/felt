version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # The marketplace, both harness manifests, skills, executable hooks, and
    # felt↔Shuttle contract must be one valid candidate before publishing.
    - go run . setup validate --source .
    # Guard: refuse to release if the plugin manifests haven't been
    # bumped to the tag's version. Claude Code and Codex both compare
    # plugin.json version when running `plugin update`; shipping a
    # release whose manifests still show the previous version means no
    # client actually picks up the new content. Use scripts/release.sh
    # to keep these in sync automatically.
    - >-
      bash -c 'claude_v=$(jq -r .version claude-plugin/.claude-plugin/plugin.json); codex_v=$(jq -r .version claude-plugin/.codex-plugin/plugin.json); if [ "$claude_v" != "$codex_v" ]; then echo "plugin manifests disagree: claude=$claude_v codex=$codex_v" >&2; exit 1; fi; case "{{ .Version }}" in *-SNAPSHOT-*) exit 0 ;; esac; if [ "$claude_v" != "{{ .Version }}" ]; then echo "plugin manifests at $claude_v / $codex_v, tag at {{ .Version }} — bump via scripts/release.sh" >&2; exit 1; fi'

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

# A tag carrying a prerelease segment (v1.1.0-rc.1) is published as a GitHub
# *prerelease*. That single flag is what makes release candidates safe: both
# install.sh and `felt update` resolve versions through GitHub's
# `releases/latest` API, and that endpoint returns the newest non-prerelease,
# non-draft release — an RC is invisible to it. GitHub also refuses to mark a
# prerelease as the repo's latest, so no `make_latest` override is needed.
# Without this block `prerelease` defaults to false and an RC would ship to
# everyone as a normal release.
release:
  # The daemon artifacts are built and boot-tested in a native matrix after
  # GoReleaser. Keep the GitHub release private until every required asset has
  # passed that matrix; the final workflow job removes the draft flag.
  draft: true
  # A failed native matrix leaves this draft behind. Re-running the tag should
  # repair that release rather than collide with its existing CLI assets.
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# Homebrew tap publishing is only for FINAL releases cut from the public
# cailmdaley/felt repo. Releases cut from LightconeResearch/felt must not
# publish to the public tap; skip the brews stage entirely when the release
# isn't originating from the public repo. Prereleases must not publish either:
# the tap has no channel concept, so a formula bump would hand every
# `brew upgrade felt` user a release candidate — the exact thing marking the
# GitHub release a prerelease is there to prevent.
brews:
  - repository:
      owner: cailmdaley
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/cailmdaley/felt
    description: Markdown-native fiber tracker and autonomous work orchestrator.
    license: MIT
    test: |
      system "#{bin}/felt", "--help"
    install: |
      bin.install "felt"
    # Refresh integrations in lockstep with the binary so users who
    # `brew upgrade felt` pick up new hooks and skills without a separate
    # step. The Claude plugin refresh is skipped silently if the claude CLI
    # isn't on PATH; Codex and pi refreshes are gated on their existing
    # integrations, so upgrading felt never installs a new harness integration
    # just because its CLI happens to be present.
    post_install: |
      if which("claude")
        system "#{bin}/felt", "setup", "claude"
      end
      # Only re-run `felt setup codex` for users who already have Codex
      # integration installed — never silently install Codex hooks for
      # users who didn't ask for them. The detection mirrors the binary's
      # own feltCodexInstalled(): plugin entry in config.toml (1.0.8+) or
      # legacy session.sh reference in hooks.json (pre-1.0.8).
      codex_config = "#{ENV["HOME"]}/.codex/config.toml"
      codex_hooks = "#{ENV["HOME"]}/.codex/hooks.json"
      # TOML quotes keys with single or double quotes depending on the
      # writer; substring-match the plugin ref instead of the full header
      # so either form is detected.
      codex_installed = (File.exist?(codex_config) && File.read(codex_config).include?("felt@cailmdaley-felt")) ||
                       (File.exist?(codex_hooks) && File.read(codex_hooks).include?("/hooks/session.sh"))
      if codex_installed && which("codex")
        system "#{bin}/felt", "setup", "codex"
      end
      # pi stores package sources in ~/.pi/agent/settings.json. Match only
      # Felt's GitHub package here: a local development checkout is owned by
      # the developer and must not be replaced by a Homebrew upgrade.
      pi_settings = "#{ENV["HOME"]}/.pi/agent/settings.json"
      pi_installed = File.exist?(pi_settings) && File.read(pi_settings).include?("git:github.com/cailmdaley/felt")
      if pi_installed && which("pi")
        system "#{bin}/felt", "setup", "pi"
      end
    # Snapshot first, deliberately: Go's `or` short-circuits, so a local
    # `goreleaser --snapshot` never reaches .Env.GITHUB_REPOSITORY (an unset
    # key there is a hard template error). .Prerelease is the tag's suffix —
    # "rc.1" for v1.1.0-rc.1, empty for v1.1.0.
    # The GitHub release is deliberately a draft while the native daemon
    # matrix is running. Do not update the tap during that window either: a
    # formula pointing at draft assets is just as broken as a public release
    # missing its daemon assets. The final workflow job retrieves this formula
    # after publishing the complete release and writes it to the tap.
    skip_upload: '{{ if or .IsSnapshot .IsDraft (ne .Prerelease "") (ne .Env.GITHUB_REPOSITORY "cailmdaley/felt") }}true{{ else }}false{{ end }}'
