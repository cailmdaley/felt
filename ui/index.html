<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDE2CE" />
    <!-- Appearance before first paint: the same choice appearance.ts reads
         (key, modes, dark themes and defaults), so a dark reader never sees
         the parchment flash before the bundle runs. -->
    <script>
      (function () {
        var root = document.documentElement, choice = {}, dark = false
        try { choice = JSON.parse(localStorage.getItem('shuttle.appearance') || 'null') || {} } catch (e) { choice = {} }
        if (choice.mode === 'dark') dark = true
        else if (choice.mode !== 'light') { try { dark = matchMedia('(prefers-color-scheme: dark)').matches } catch (e) { dark = false } }
        var theme = choice.dark === 'lamplight' ? 'lamplight' : 'night-chart'
        root.dataset.wsAppearance = dark ? 'dark' : 'light'
        root.dataset.wsDarkTheme = theme
        if (dark) document.querySelector('meta[name="theme-color"]').content = theme === 'lamplight' ? '#0F0B0F' : '#0A1019'
      })()
    </script>
    <title>Shuttle</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen makes the board an app of its own: no address bar,
         no Safari chrome, its own icon. `display: standalone` in the manifest is
         the modern switch; the apple- metas are what iOS Safari still reads. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shuttle" />
    <!-- The board's first read starts with the page, not after the bundle runs. -->
    <link rel="preload" href="/api/v1/fibers/composite" as="fetch" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preloaded, not linked: a stylesheet would hold first paint and every
         script until Google answers. main.ts applies it once the bundle runs. -->
    <link
      id="webfonts"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="preload"
      as="style"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
