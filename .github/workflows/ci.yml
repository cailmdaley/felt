name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (felt CLI — build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Validate complete plugin candidate
        run: go run . setup validate --source .

      - name: Test
        run: go test -v ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Integration Test
        run: go test -tags integration ./cmd/ -run TestIntegration -v

      # Deliberately in the go job, not elixir: that one installs felt to
      # /usr/local/bin, which felt-bin.sh's candidate loop finds — the
      # felt-absent fallback assertion would silently test the wrong branch.
      - name: Plugin hook tests
        run: bash scripts/test-plugin-hooks.sh

      - name: Bootstrap login shell and failure handling
        run: bash scripts/test-bootstrap.sh

      # The two plugin manifests ship as one plugin; .goreleaser.yml refuses to
      # release when they disagree. Catch the drift at PR time instead.
      - name: Plugin manifests agree on version
        run: |
          claude=$(jq -r .version claude-plugin/.claude-plugin/plugin.json)
          codex=$(jq -r .version claude-plugin/.codex-plugin/plugin.json)
          if [ "$claude" != "$codex" ]; then
            echo "plugin manifest version drift: claude=$claude codex=$codex" >&2
            exit 1
          fi
          echo "both manifests at $claude"

  elixir:
    name: Elixir (daemon — mix compile + mix test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          # Pinned to match the release build matrix (release.yml): a release
          # bundles whichever OTP built it, so CI must test what ships.
          otp-version: "28"
          elixir-version: "1.19"

      # The daemon shells out to `felt` for store walks; build it from THIS
      # checkout (source of truth in the merged repo) rather than downloading a
      # possibly-older release.
      - name: Set up Go (to build felt CLI)
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build + install felt CLI
        run: |
          GOBIN=/usr/local/bin go install .
          felt --version

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: daemon/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache _build
        uses: actions/cache@v4
        with:
          path: daemon/_build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install dependencies
        working-directory: daemon
        run: mix deps.get

      - name: Check dependency security advisories
        working-directory: daemon
        run: |
          mix escript.install hex mix_audit 2.1.5 --force
          "$HOME/.mix/escripts/mix_audit"

      - name: Compile (warnings as errors)
        working-directory: daemon
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: daemon
        run: mix test

  ui:
    name: UI (board bundle — tests + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check production dependency advisories
        run: npm audit --omit=dev

      # npm test deliberately runs the board suite twice under pinned
      # America/Los_Angeles and Europe/Paris offsets. The civil-day logic can
      # pass in one timezone and fail in the other, so this is a release gate.
      - name: Run board tests
        run: npm test

      # Ambient declarations in src/paper/lightcone.d.ts satisfy the typecheck
      # even without the private lightcone-ui checkout, and vite.config's
      # existsSync guard drops the paper entry when it's absent — so the full
      # build (tsc + vite) succeeds on a stranger's clone, CI included.
      - name: Build board bundle
        run: npm run build

  # Warm the EL8 OTP cache that release.yml's daemon legs restore from.
  #
  # This job exists purely because of how actions/cache is scoped. A cache entry
  # is visible to the ref that saved it and to the repository's DEFAULT BRANCH,
  # nothing else. release.yml runs on tag pushes, so an entry it saves under
  # refs/tags/v1.1.1 is invisible to the next tag — every release would pay the
  # 10-20 minute OTP source build on every leg, forever. Saving the same key
  # here, on pushes to main, puts it somewhere a tag build can actually read.
  #
  # The key, the container and the build script are shared with release.yml
  # (see .github/el8-toolchain.env); if they drift, the cache silently stops
  # hitting and releases just get slower, which is why release.yml asserts the
  # image matches its pin.
  el8-otp-cache:
    name: Warm the EL8 OTP cache (${{ matrix.label }})
    # Only main can host a cache a tag build will read; on a PR this job would
    # build OTP and save an entry nothing can ever restore.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: x86_64
          - os: ubuntu-24.04-arm
            label: arm64
    runs-on: ${{ matrix.os }}
    container:
      image: almalinux:8
    steps:
      # See release.yml: the image has no git, and checkout degrades without it.
      - name: Bootstrap git for checkout
        run: |
          set -eux
          dnf -y install git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      - name: Load the pinned EL8 toolchain versions
        run: grep -E '^[A-Z0-9_]+=' .github/el8-toolchain.env >>"$GITHUB_ENV"

      # lookup-only: probe for the key without downloading ~200 MB we would only
      # throw away. On a hit the job is a no-op and finishes in seconds.
      - name: Is the cache already warm?
        id: probe
        uses: actions/cache/restore@v4
        with:
          path: /opt/otp
          key: el8-almalinux8-${{ runner.arch }}-otp-${{ env.EL8_OTP_VERSION }}
          lookup-only: true

      - name: Install the EL8 build toolchain
        if: steps.probe.outputs.cache-hit != 'true'
        run: bash scripts/el8-toolchain.sh

      - name: Build OTP from source
        if: steps.probe.outputs.cache-hit != 'true'
        run: bash scripts/build-otp-el8.sh /opt/otp

      - name: Save the OTP build for release.yml
        if: steps.probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/otp
          key: el8-almalinux8-${{ runner.arch }}-otp-${{ env.EL8_OTP_VERSION }}
