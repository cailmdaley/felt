name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Keep the release tool reproducible. v2.17.1 is the version that
          # produced the published 1.1.0-rc.3 assets; upgrade it deliberately
          # alongside the config migration away from the deprecated `brews`
          # publisher.
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Preserve the formula generated for these exact archives
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: dist/homebrew/Formula/felt.rb
          if-no-files-found: error
          retention-days: 1

  # The Shuttle daemon: one ERTS-bundled Mix release per platform, built on
  # NATIVE runners (a release bundles whichever OTP built it, and BEAM bytecode
  # + ERTS must match the platform they run on), each boot-tested on the
  # platform it targets, then attached to the release goreleaser just created.
  #
  # The Linux legs build inside an `almalinux:8` container, NOT on the bare
  # ubuntu runner. A Mix release ships prebuilt native binaries — beam.smp,
  # erl_child_setup, the crypto NIFs — and those inherit the symbol-version
  # floor of whatever host compiled them. Built on ubuntu-latest they demand
  # GLIBC_2.38 / GLIBCXX_3.4.30 / GCC_12.0.0, and every HPC cluster we run on
  # (RHEL/Rocky/Alma 8, glibc 2.28, plus Alma 9) refuses to load them. EL8 is
  # the `manylinux_2_28` baseline: glibc 2.28 and the gcc-8 toolchain, so an
  # artifact built there runs on EL8 and on everything newer.
  #
  # The cost of that floor is OTP from source: erlef/setup-beam has no EL8
  # prebuilt, so the Linux legs run scripts/build-otp-el8.sh into /opt/otp and
  # cache it. A tag build can only read caches saved on the default branch, so
  # ci.yml warms that same key on pushes to main and this job normally restores
  # rather than builds. Pins live in .github/el8-toolchain.env, read by both.
  # macOS legs are untouched and still use setup-beam.
  #
  # scripts/check-glibc-floor.sh guards the invariant, and it is not redundant
  # with the boot test below. The boot test runs ON THE BUILD HOST, where the
  # symbols the artifact needs are present by construction — it cannot fail the
  # way a cluster does. The gate reads the requirement out of the ELF itself, so
  # it catches a regression (a base-image bump, a leg silently losing its
  # container) at build time rather than on someone's login node.
  #
  # The Go CLI legs are unaffected: goreleaser builds them CGO_ENABLED=0, so
  # they have no libc dependency at all.
  daemon:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          # almalinux:8 is multi-arch, so the same reference gives x86_64 on
          # ubuntu-latest and aarch64 on the arm runner. The macOS entries use
          # an EMPTY image, which runs the job directly on the runner. That
          # empty value must reach the job through the `container.image`
          # expression below — a literal `container: ""` is rejected by
          # workflow schema validation ("Unexpected value ''").
          - os: ubuntu-latest
            container: "almalinux:8"
            artifact: shuttle_Linux_x86_64.tar.gz
          - os: ubuntu-24.04-arm
            container: "almalinux:8"
            artifact: shuttle_Linux_arm64.tar.gz
          # Intel macOS is macos-15-intel now. macos-13 was retired: a job
          # targeting it does not fail, it queues forever against a label with
          # no runners (observed on v1.1.0-rc.1 — 50 minutes, no runner, while
          # every other platform finished in about a minute).
          - os: macos-15-intel
            container: ""
            artifact: shuttle_Darwin_x86_64.tar.gz
          - os: macos-14
            container: ""
            artifact: shuttle_Darwin_arm64.tar.gz
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container || '' }}
    steps:
      # BEFORE checkout, deliberately: the almalinux:8 image has no git, and
      # actions/checkout silently degrades to a REST tarball download without
      # it. Only git here — the rest of the toolchain lives in a repo script
      # that does not exist until checkout has run.
      - name: Bootstrap git for checkout
        if: matrix.container != ''
        run: |
          set -eux
          dnf -y install git
          # The checkout lands owned by a different uid than the container root
          # that reads it; without this every later `git` call aborts on
          # "dubious ownership".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v4

      # Both workflows read the same file, so the cache key they compute and the
      # OTP they build are the same by construction.
      - name: Load the pinned EL8 toolchain versions
        if: matrix.container != ''
        run: grep -E '^[A-Z0-9_]+=' .github/el8-toolchain.env >>"$GITHUB_ENV"

      - name: The container image must match the pinned one
        if: matrix.container != ''
        run: |
          set -eu
          if [ "${{ matrix.container }}" != "$EL8_IMAGE" ]; then
            echo "matrix container '${{ matrix.container }}' != EL8_IMAGE '$EL8_IMAGE'" >&2
            echo "the cache key says one image and the job runs another; fix .github/el8-toolchain.env" >&2
            exit 1
          fi

      - name: Install the EL8 build toolchain
        if: matrix.container != ''
        run: bash scripts/el8-toolchain.sh

      # /opt/otp is the slow part of this job (a 10-20 min source build), so it
      # is cached. actions/cache is scoped per ref and falls back only to the
      # DEFAULT BRANCH — and this workflow runs on tag pushes, so an entry saved
      # under refs/tags/v1.1.1 is invisible to v1.1.2. ci.yml warms this exact
      # key on pushes to main, which is the only ref a tag build can read from.
      # Key, script and pins are shared with ci.yml; keep them in lockstep.
      - name: Restore the source-built OTP
        if: matrix.container != ''
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: /opt/otp
          key: el8-almalinux8-${{ runner.arch }}-otp-${{ env.EL8_OTP_VERSION }}

      - name: Build OTP from source (cache miss)
        if: matrix.container != '' && steps.otp-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-otp-el8.sh /opt/otp

      - name: Install Elixir and put the EL8 toolchain on PATH
        if: matrix.container != ''
        run: |
          set -eux
          curl -fsSL -o /tmp/elixir.zip \
            "https://github.com/elixir-lang/elixir/releases/download/v${EL8_ELIXIR_VERSION}/elixir-otp-28.zip"
          mkdir -p /opt/elixir
          unzip -q /tmp/elixir.zip -d /opt/elixir
          echo "/opt/otp/bin" >>"$GITHUB_PATH"
          echo "/opt/elixir/bin" >>"$GITHUB_PATH"
          export PATH="/opt/otp/bin:/opt/elixir/bin:$PATH"
          elixir --version
          mix local.hex --force
          mix local.rebar --force

      - name: Install the gh CLI (EL8)
        if: matrix.container != ''
        run: |
          set -eux
          case "$(uname -m)" in
            x86_64)  gh_arch=amd64 ;;
            aarch64) gh_arch=arm64 ;;
            *) echo "unsupported arch for the gh tarball: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${EL8_GH_VERSION}/gh_${EL8_GH_VERSION}_linux_${gh_arch}.tar.gz"
          tar -C /tmp -xzf /tmp/gh.tar.gz
          install -m 0755 "/tmp/gh_${EL8_GH_VERSION}_linux_${gh_arch}/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Set up Elixir (macOS)
        if: matrix.container == ''
        uses: erlef/setup-beam@v1
        with:
          # Keep in lockstep with ci.yml: the release ships this OTP.
          otp-version: "28"
          elixir-version: "1.19"

      - name: Set up Node (UI bundle)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The daemon shells `felt` at runtime; the boot test below runs a real
      # poller tick, so give it a real CLI.
      - name: Set up Go (felt CLI for the boot test)
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build the UI bundle into priv/
        run: |
          cd ui
          npm ci
          npm run build
          mkdir -p ../daemon/priv/ui
          cp -R dist ../daemon/priv/ui/dist

      # SHUTTLE_VERSION stamps the tag into mix.exs's `version:`, which Mix
      # bakes into the app spec inside the artifact — that is what
      # `Shuttle.version/0` and `/api/v1/version`'s `mix_vsn` report. Without
      # it every release would claim the mix.exs fallback. The leading "v" is
      # stripped here because a tag is not a SemVer string.
      - name: Assemble the release
        working-directory: daemon
        run: |
          export SHUTTLE_VERSION="${GITHUB_REF_NAME#v}"
          mix deps.get --only prod
          MIX_ENV=prod mix shuttle.gen_version
          # compile.app --force is load-bearing, not belt-and-braces. Mix
          # regenerates the .app file only when mix.exs is NEWER than it — an
          # env var changing the version leaves both mtimes untouched, so a
          # warm _build silently keeps the previous vsn. A fresh checkout has
          # no _build and gets it right by luck; the day anyone caches _build
          # to speed this job up, every release would ship the fallback
          # version instead of the tag. Force it after compile (before, and
          # the .app would record an empty module list).
          MIX_ENV=prod mix compile
          MIX_ENV=prod mix compile.app --force
          MIX_ENV=prod mix release shuttled --path ../out/shuttle

      # Linux only: macOS has no glibc and nothing to check. This must run
      # before the boot test, because the boot test cannot fail the way a
      # cluster does — it runs on the host that produced the binaries.
      - name: Check the artifact's glibc floor
        if: matrix.container != ''
        run: bash scripts/check-glibc-floor.sh out/shuttle

      - name: Boot-test the artifact
        run: |
          go install .
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p /tmp/boot-store/.felt
          export SHUTTLE_PORT=4390 SHUTTLE_HOST=ci-boot-test FELT_STORES=/tmp/boot-store
          out/shuttle/bin/shuttle start --force >/tmp/daemon.log 2>&1 &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4390/api/v1/version; then break; fi
            sleep 1
            if [ "$i" = 60 ]; then echo "daemon never bound"; cat /tmp/daemon.log; exit 1; fi
          done
          # The artifact must report the tag it was stamped with. Only a built
          # release can show this — mix.exs's fallback compiles fine either
          # way, so a broken stamp is silent until someone reads mix_vsn.
          VSN="${GITHUB_REF_NAME#v}"
          if ! curl -fsS http://127.0.0.1:4390/api/v1/version | grep -Eq "\"mix_vsn\": *\"${VSN}\""; then
            echo "daemon reports the wrong mix_vsn (expected ${VSN}):"
            curl -fsS http://127.0.0.1:4390/api/v1/version
            exit 1
          fi
          # A bound daemon is still unhealthy if it loaded a stale felt CLI.
          curl -fsS http://127.0.0.1:4390/api/v1/version |
            jq -e '.contract.ok == true and .contract.expected == .contract.observed' >/dev/null
          # The artifact must serve the UI bundle it shipped with.
          curl -fsS -o /dev/null http://127.0.0.1:4390/index.html
          # And the shim's HTTP verbs must answer.
          SHUTTLE_PORT=4390 out/shuttle/bin/shuttle snapshot >/dev/null
          kill "$DAEMON_PID"

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -C out -czf "${{ matrix.artifact }}" shuttle
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.artifact }}" --clobber --repo "${GITHUB_REPOSITORY}"

  # GoReleaser creates the CLI draft first so the daemon jobs can attach their
  # native artifacts. Keep that release as a draft until every matrix
  # member booted and uploaded its tarball; a failed platform therefore cannot
  # leave a public stable release that makes SHUTTLE=1 installs fail halfway
  # through.
  publish:
    name: Publish complete release
    needs: [goreleaser, daemon]
    runs-on: ubuntu-latest
    steps:
      # Download before changing the draft flag. If GoReleaser did not leave
      # the formula artifact behind, the release stays private and the failure
      # is repairable from the workflow run.
      - name: Retrieve the formula from the GoReleaser run
        uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: dist/homebrew/Formula

      - name: Verify every required asset is attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          checksum_asset="felt_${GITHUB_REF_NAME#v}_checksums.txt"
          for asset in \
            felt_Darwin_arm64.tar.gz felt_Darwin_x86_64.tar.gz \
            felt_Linux_arm64.tar.gz felt_Linux_x86_64.tar.gz \
            shuttle_Darwin_arm64.tar.gz shuttle_Darwin_x86_64.tar.gz \
            shuttle_Linux_arm64.tar.gz shuttle_Linux_x86_64.tar.gz; do
            if ! grep -Fqx "$asset" <<<"$assets"; then
              echo "release is missing required asset: $asset" >&2
              exit 1
            fi
          done
          if ! grep -Fqx "$checksum_asset" <<<"$assets"; then
            echo "release is missing required asset: $checksum_asset" >&2
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY}" == "cailmdaley/felt" && "${GITHUB_REF_NAME}" != *-* && -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "stable release is missing HOMEBREW_TAP_TOKEN; refusing to publish" >&2
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
      - name: Update the Homebrew tap after publication
        if: ${{ github.repository == 'cailmdaley/felt' && !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/homebrew/Formula/felt.rb
          tap_path="repos/cailmdaley/homebrew-tap/contents/Formula/felt.rb"
          tap_file="$(mktemp)"
          gh api "$tap_path" --jq '.content' | tr -d '\n' | base64 --decode >"$tap_file"
          if cmp -s dist/homebrew/Formula/felt.rb "$tap_file"; then
            echo "Homebrew formula already current."
          else
            content="$(base64 <dist/homebrew/Formula/felt.rb | tr -d '\n')"
            sha="$(gh api "$tap_path" --jq '.sha')"
            gh api --method PUT "$tap_path" \
              -f "message=felt ${GITHUB_REF_NAME#v}" \
              -f "content=${content}" \
              -f "sha=${sha}"
          fi
